; Alembic configuration for ACOP.
;
; The database URL is intentionally NOT stored here. It is assembled from
; environment variables in migrations/env.py so that credentials never enter
; version control (section 24 of the design brief).

[alembic]
script_location = migrations
prepend_sys_path = src
; Split prepend_sys_path on the OS path separator rather than the legacy
; space/comma/colon behaviour, which mangles Windows paths.
path_separator = os

; Migration filenames are prefixed with a zero-padded sequence number so that
; `ls` shows them in application order, and with a UTC timestamp so that two
; people generating migrations on the same day do not collide.
file_template = %%(rev)s_%%(slug)s
timezone = UTC

[post_write_hooks]
; `exec`, not `console_scripts`. Alembic's console_scripts hook resolves the
; entrypoint through installed distribution metadata, and ruff ships a native
; binary with no Python console_scripts entry point - so this hook always
; failed with "Could not find entrypoint console_scripts.ruff", *after* the
; revision file had already been written. `make migration` therefore ended in
; an error and left an unformatted file behind. `exec` runs the executable
; found on PATH, which is what was intended. Verified against alembic 1.19.1.
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
