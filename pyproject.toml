[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cyberwithsteve-acop"
version = "0.1.0"
description = "CyberWithSteve ACOP - Autonomous Cyber Operations Platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Steve White" }]

dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.8,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "sqlalchemy[asyncio]>=2.0.30,<3.0",
    "asyncpg>=0.29,<0.31",
    "alembic>=1.13,<2.0",
    "httpx>=0.27,<0.29",
    "structlog>=24.1,<26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-asyncio>=0.23,<1.1",
    "pytest-cov>=5.0,<7.0",
    "respx>=0.21,<0.23",
    "ruff>=0.6,<1.0",
    "mypy>=1.11,<2.0",
    "types-python-dateutil",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = [
    "integration: requires a live PostgreSQL database (ACOP_TEST_DATABASE=1)",
    "live_ollama: requires a reachable Ollama host (ACOP_TEST_OLLAMA=1)",
]
filterwarnings = ["error::DeprecationWarning:acop.*"]

[tool.coverage.run]
source = ["acop"]
branch = true

[tool.ruff]
line-length = 90
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # bugbear
    "S",    # bandit - security lint
    "C4",   # comprehensions
    "DTZ",  # naive datetime usage
    "T20",  # no print() in library code
    "RUF",
]
ignore = [
    "E501",  # line length is handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]   # asserts and test credentials are expected
"scripts/*" = ["T201"]                  # scripts are CLI tools and may print
"migrations/*" = ["N999", "T201"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["acop"]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
